<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox oefenen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2>Stap 1 &ndash; display: flex</h2>
    <div class="rij">           <!-- parent -->
        <div class="blok">1</div>   <!-- child -->
        <div class="blok">2</div>   <!-- child -->
        <div class="blok">3</div>   <!-- child -->
    </div>

    <h2>Stap 2 &ndash; justify-content: space-evenly</h2>
    <div class="rij verdeeld">
        <div class="blok">1</div>
        <div class="blok">2</div>
        <div class="blok">3</div>
    </div>

    <h2>Stap 3 &ndash; precies in het midden</h2>
    <div class="rij midden">
        <div class="blok">1</div>
        <div class="blok">2</div>
        <div class="blok">3</div>
    </div>

    <h2>Stap 4 &ndash; gap</h2>
    <div class="rij met-gap">
        <div class="blok">1</div>
        <div class="blok">2</div>
        <div class="blok">3</div>
    </div>
</body>
</html>
